name: magicmirror
description: "Intelligent mirror application for personalized user experience and outfit suggestions."
publish_to: 'none' 

version: 1.1.0-beta+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^9.0.0

  # CupertinoIcons
  cupertino_icons: ^2.0.0

  # State Management
  flutter_riverpod: ^3.2.1
  riverpod: ^3.2.1

  # Camera & Media
  camera: ^0.12.0
  image: ^4.1.3
  file_picker: ^13.0.0
  image_picker: ^1.1.2
  image_cropper: ^12.2.1

  # Permissions

  # ML Kit for morphology detection
  google_ml_kit: ^0.23.1

  # HTTP & API
  dio: ^5.3.1
  http: ^1.1.0

  # Geolocation
  geolocator: ^14.0.2

  # Storage
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  path_provider: ^2.1.1

  # Configuration & Environment
  flutter_dotenv: ^6.0.0
  supabase_flutter: ^2.9.1

  # Date & Time
  intl: ^0.20.2
  collection: ^1.18.0

  # Utils
  uuid: ^4.0.0
  equatable: ^3.0.0
  url_launcher: ^6.2.0

  # Networking
  connectivity_plus: ^7.0.0
  permission_handler: ^13.0.1
  flutter_tts: ^4.2.5
  camera_linux: ^0.0.8
  flutter_secure_storage: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  mocktail: ^1.0.4

# Flutter packages.
flutter:
  generate: true

  uses-material-design: true

  # Assets
  assets:
    - assets/logo/
    - assets/.env

  fonts:
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend-VariableFont_wght.ttf


flutter_launcher_icons:
  image_path: "assets/logo/magicmirrorlogo.png"
  remove_alpha_ios: true
  
  android: true
  ios: true
  
  windows:
    generate: true
    image_path: "assets/logo/magicmirrorlogo.png"
  
  macos:
    generate: true
    image_path: "assets/logo/magicmirrorlogo.png"
  
  linux:
    generate: true
    image_path: "assets/logo/magicmirrorlogo.png"
  
  web:
    generate: true
    image_path: "assets/logo/magicmirrorlogo.png"
    background_color: "#1a1a2e"
